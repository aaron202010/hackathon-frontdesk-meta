<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Smile Dental Clinic</title>
<style>
  :root { --blue: #0084ff; --bubble: #e4e6eb; --bg: #ffffff; --ink: #050505; --muted: #65676b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #e4e6eb; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header .name { font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header button { margin-left: auto; border: 1px solid #ccd0d5; background: #fff; border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { flex-shrink: 0; max-width: 78%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  .photo { position: relative; padding: 0; overflow: hidden; background: none; width: 70%; max-width: 70%; flex-shrink: 0; }
  .photo img { display: block; width: 100%; border-radius: 18px; }
  .photo .box { position: absolute; border: 3px solid #f02849; border-radius: 6px; box-sizing: border-box; display: none; }
  .photo .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 10px; display: none; }
  .read { flex-shrink: 0; align-self: flex-start; background: #fff; border: 1px solid #ccd0d5; border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }
  .read b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #e4e6eb; }
  input { flex: 1; border: none; background: #f0f2f5; border-radius: 20px; padding: 10px 14px; font-size: 15px; }
  input:focus { outline: 2px solid var(--blue); }
  .card-btn { align-self: center; border: 1px solid #ccd0d5; border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .card-btn input { display: none; }
  form button { border: none; background: none; color: var(--blue); font-weight: 600; cursor: pointer; }
  /* agent panel (2026-10-28): what the agent did on each message, next to the chat */
  .shell { display: flex; justify-content: center; height: 100dvh; }
  .shell .app { margin: 0; flex: 0 1 480px; border-right: 1px solid #e4e6eb; }
  .panel { flex: 0 1 400px; display: flex; flex-direction: column; background: #f7f8fa; }
  .panel h2 { margin: 0; padding: 14px 16px 4px; font-size: 15px; }
  .panel .hint { padding: 0 16px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid #e4e6eb; }
  #steps { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .turn { background: #fff; border: 1px solid #e4e6eb; border-radius: 10px; padding: 10px 12px; }
  .turn .q { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turn ol { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.45; }
  .turn li { margin: 4px 0; }
  .turn .d { display: block; font-size: 12px; color: var(--muted); }
  .turn .ms { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .turn .tot { margin-top: 6px; font-size: 11px; color: var(--muted); }
  #panelBtn { display: none; }
  @media (max-width: 900px) {
    .shell { display: block; }
    .shell .app { width: 100%; max-width: 100%; border-right: none; }
    header { gap: 8px; padding: 10px 12px; }
    header .avatar { width: 32px; height: 32px; flex-shrink: 0; }
    header > div:nth-child(2) { min-width: 0; }
    header .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header button { padding: 5px 8px; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
    form { padding: 10px 12px; }
    input { min-width: 0; }
    .panel { display: none; position: fixed; inset: 74px 0 0 0; z-index: 5; }
    .panel.open { display: flex; }
    #panelBtn { display: inline-block; margin-left: 6px; }
    header button#takeover { margin-left: auto; }
  }
</style>
</head>
<body>
<div class="shell">
<div class="app">
  <header>
    <div class="avatar">BS</div>
    <div><div class="name">Bright Smile Dental Clinic</div><div class="sub">Sample clinic. Fake data only.</div></div>
    <button id="takeover" type="button" title="Pause the bot, staff continues">Staff takeover</button>
    <button id="panelBtn" type="button" title="Show what the agent did">Agent steps</button>
  </header>
  <div id="log"><div class="msg bot">Hello! Bright Smile Dental Clinic here. Prices, hours, HMO cards, bookings: ask away.</div></div>
  <form id="f"><label class="card-btn">Send HMO card<input id="card" type="file" accept="image/*"></label><input id="t" autocomplete="off" placeholder="Aa" maxlength="2000"><button type="submit">Send</button></form>
</div>
<aside class="panel" id="panel" aria-label="Agent steps">
  <h2>What the agent did</h2>
  <div class="hint">Every message: the safety screen, each Meta model call, each tool and its result.</div>
  <div id="steps"><div class="hint" style="border:none;padding:0">Send a message to see the steps.</div></div>
</aside>
</div>
<script>
  const chatId = "web-" + Math.random().toString(36).slice(2, 10);
  const log = document.getElementById("log"), input = document.getElementById("t");
  function add(text, cls) {
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function addPhoto(file) {
    const d = document.createElement("div"); d.className = "msg me photo";
    const img = document.createElement("img"); img.src = URL.createObjectURL(file); img.alt = "HMO card photo";
    const box = document.createElement("div"); box.className = "box";
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = "SAM 3.1: card found";
    d.append(img, box, tag); log.appendChild(d);
    img.onload = () => { log.scrollTop = log.scrollHeight; };
    return d;
  }
  function markBox(shot, b) {
    const img = shot.querySelector("img");
    const place = () => {
      const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return;
      const box = shot.querySelector(".box");
      box.style.left = (100 * b.x / w) + "%"; box.style.top = (100 * b.y / h) + "%";
      box.style.width = (100 * b.w / w) + "%"; box.style.height = (100 * b.h / h) + "%";
      box.style.display = "block"; shot.querySelector(".tag").style.display = "block";
    };
    img.complete ? place() : img.addEventListener("load", place);
  }
  function addRead(c) {
    const d = document.createElement("div"); d.className = "read";
    const rows = [["Insurer", c.insurer], ["Member", c.member_name], ["Member ID", c.member_id], ["Valid thru", c.valid_thru]];
    rows.forEach(([k, v]) => { if (!v) return; const p = document.createElement("div"); const t = document.createElement("b"); t.textContent = k; p.append(t, document.createTextNode(v)); d.appendChild(p); });
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  const stepsEl = document.getElementById("steps");
  function secs(ms) { return ms == null ? "" : (ms / 1000).toFixed(1) + " s"; }
  function addSteps(asked, steps, wallMs) {
    if (!steps || !steps.length) return;
    if (stepsEl.firstElementChild && stepsEl.firstElementChild.classList.contains("hint")) stepsEl.innerHTML = "";
    const t = document.createElement("div"); t.className = "turn";
    const q = document.createElement("div"); q.className = "q"; q.textContent = asked;
    const ol = document.createElement("ol");
    steps.forEach(s => {
      const li = document.createElement("li"); li.textContent = s.label;
      if (s.ms != null) { const m = document.createElement("span"); m.className = "ms"; m.textContent = " · " + secs(s.ms); li.appendChild(m); }
      if (s.detail) { const d = document.createElement("span"); d.className = "d"; d.textContent = s.detail; li.appendChild(d); }
      ol.appendChild(li);
    });
    const tot = document.createElement("div"); tot.className = "tot"; tot.textContent = "Reply in " + secs(wallMs);
    t.append(q, ol, tot); stepsEl.appendChild(t); stepsEl.scrollTop = stepsEl.scrollHeight;
  }
  document.getElementById("panelBtn").addEventListener("click", () => document.getElementById("panel").classList.toggle("open"));
  async function send(text) {
    add(text, "me");
    try {
      const t0 = performance.now();
      const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chatId, text }) });
      const j = await r.json();
      add(j.reply || "(no reply)", "bot");
      addSteps("You: " + text, j.steps, performance.now() - t0);
      if (j.screen !== "ok") add("screen: " + j.screen, "sys");
    } catch (e) { add("Could not reach the server.", "sys"); }
  }
  document.getElementById("card").addEventListener("change", async e => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    const shot = addPhoto(file);
    const form = new FormData(); form.append("chat_id", chatId); form.append("file", file);
    try {
      const t0 = performance.now();
      const r = await fetch("/card", { method: "POST", body: form });
      const j = await r.json();
      addSteps("You: sent a photo of an HMO card", j.steps, performance.now() - t0);
      if (j.box) markBox(shot, j.box);
      if (j.card && j.card.insurer) addRead(j.card);
      add(j.reply || j.detail || "(no reply)", "bot");
    } catch (err) { add("Could not reach the server.", "sys"); }
  });
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = input.value.trim(); if (!v) return; input.value = ""; send(v); });
  document.getElementById("takeover").addEventListener("click", () => send("/takeover"));
</script>
</body>
</html>
