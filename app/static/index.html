<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Smile Dental Clinic</title>
<style>
  :root { --blue: #0084ff; --bubble: #e4e6eb; --bg: #ffffff; --ink: #050505; --muted: #65676b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #e4e6eb; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header .name { font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header button { margin-left: auto; border: 1px solid #ccd0d5; background: #fff; border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #e4e6eb; }
  input { flex: 1; border: none; background: #f0f2f5; border-radius: 20px; padding: 10px 14px; font-size: 15px; }
  input:focus { outline: 2px solid var(--blue); }
  .card-btn { align-self: center; border: 1px solid #ccd0d5; border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .card-btn input { display: none; }
  form button { border: none; background: none; color: var(--blue); font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">BS</div>
    <div><div class="name">Bright Smile Dental Clinic</div><div class="sub">Sample clinic. Fake data only.</div></div>
    <button id="takeover" type="button" title="Pause the bot, staff continues">Staff takeover</button>
  </header>
  <div id="log"><div class="msg bot">Hello po! Bright Smile Dental Clinic here. Prices, hours, HMO cards, bookings: ask away.</div></div>
  <form id="f"><label class="card-btn">Send HMO card<input id="card" type="file" accept="image/*"></label><input id="t" autocomplete="off" placeholder="Aa" maxlength="2000"><button type="submit">Send</button></form>
</div>
<script>
  const chatId = "web-" + Math.random().toString(36).slice(2, 10);
  const log = document.getElementById("log"), input = document.getElementById("t");
  function add(text, cls) {
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  async function send(text) {
    add(text, "me");
    try {
      const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chatId, text }) });
      const j = await r.json();
      add(j.reply || "(no reply)", "bot");
      if (j.screen !== "ok") add("screen: " + j.screen, "sys");
    } catch (e) { add("Could not reach the server.", "sys"); }
  }
  document.getElementById("card").addEventListener("change", async e => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    add("Photo: " + file.name, "me");
    const form = new FormData(); form.append("chat_id", chatId); form.append("file", file);
    try {
      const r = await fetch("/card", { method: "POST", body: form });
      const j = await r.json();
      add(j.reply || j.detail || "(no reply)", "bot");
    } catch (err) { add("Could not reach the server.", "sys"); }
  });
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = input.value.trim(); if (!v) return; input.value = ""; send(v); });
  document.getElementById("takeover").addEventListener("click", () => send("/takeover"));
</script>
</body>
</html>
