<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frontdesk-arch-title frontdesk-arch-desc">
    <title id="frontdesk-arch-title">Front Desk on Meta models, architecture</title>
    <desc id="frontdesk-arch-desc">A patient's chat passes a guard, then an agent on Muse Spark with tools reads and writes a clinic store and returns a booking summary; emergencies, clinical questions and takeover go to a human; an HMO card photo is cropped by SAM 3.1, read by Muse, and its fields land in the store.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- arrows first -->
    <!-- patient -> guard (y=96) -->
    <line x1="200" y1="96" x2="276" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="212" y="76" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="238" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MESSAGE</text>
    <!-- guard -> agent (y=96) -->
    <line x1="440" y1="96" x2="516" y2="96" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <rect x="456" y="76" width="44" height="12" rx="2" fill="#f5f5f5"/>
    <text x="478" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>
    <!-- agent -> summary (y=96) -->
    <line x1="720" y1="96" x2="796" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="732" y="76" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="758" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLY</text>
    <!-- guard -> human handoff (vertical, x=360) -->
    <line x1="360" y1="128" x2="360" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="372" y="152" width="112" height="12" rx="2" fill="#f5f5f5"/>
    <text x="428" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMERGENCY · CLINICAL</text>
    <!-- agent -> trace (vertical, x=560) -->
    <line x1="560" y1="128" x2="560" y2="196" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="572" y="152" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="608" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text>
    <!-- agent -> store: down from x=684 to y=232, elbow right to store left edge (x=800) -->
    <path d="M684 128 L684 224 Q684 232 692 232 L796 232" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="696" y="152" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="736" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 TOOLS</text>
    <!-- card photo -> sam (y=368) -->
    <line x1="200" y1="368" x2="276" y2="368" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="216" y="348" width="44" height="12" rx="2" fill="#f5f5f5"/>
    <text x="238" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHOTO</text>
    <!-- sam -> muse read (y=368) -->
    <line x1="440" y1="368" x2="516" y2="368" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <rect x="456" y="348" width="44" height="12" rx="2" fill="#f5f5f5"/>
    <text x="478" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROP</text>
    <!-- muse read -> store: right along y=368 to x=870, up to store bottom (y=264) -->
    <path d="M720 368 L862 368 Q870 368 870 360 L870 268" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="748" y="348" width="84" height="12" rx="2" fill="#f5f5f5"/>
    <text x="790" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CARD FIELDS</text>

    <!-- nodes -->
    <!-- patient chat (input) -->
    <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="48" y="70" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.4)" stroke-width="0.8"/>
    <text x="66" y="79" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="120" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Patient chat</text>
    <text x="120" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">messenger-style page</text>
    <!-- guard -->
    <rect x="280" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="280" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="288" y="70" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="308" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
    <text x="360" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen first</text>
    <text x="360" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no model call before it</text>
    <!-- agent (focal 1) -->
    <rect x="520" y="64" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="520" y="64" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="528" y="70" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
    <text x="548" y="79" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
    <text x="620" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Muse Spark 1.3 with tools</text>
    <text x="620" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slots · hmo check · price · book</text>
    <!-- booking summary -->
    <rect x="800" y="64" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="800" y="64" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="860" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking summary</text>
    <text x="860" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">date · time · HMO</text>
    <!-- human handoff -->
    <rect x="280" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="280" y="200" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="360" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human handoff</text>
    <text x="360" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clinic line · staff takeover</text>
    <!-- trace log (store) -->
    <rect x="520" y="200" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="520" y="200" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="580" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trace log</text>
    <text x="580" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logs/trace.jsonl</text>
    <!-- clinic store -->
    <rect x="800" y="200" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="800" y="200" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="860" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clinic store</text>
    <text x="860" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clinic.json · SQLite</text>
    <!-- card photo (input) -->
    <rect x="40" y="336" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="336" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="48" y="342" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.4)" stroke-width="0.8"/>
    <text x="66" y="351" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="120" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HMO card photo</text>
    <text x="120" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sample card, marked SAMPLE</text>
    <!-- sam 3.1 (focal 2) -->
    <rect x="280" y="336" width="160" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="280" y="336" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="288" y="342" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
    <text x="310" y="351" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VISION</text>
    <text x="360" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SAM 3.1 segment</text>
    <text x="360" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt "ID card" → box + mask</text>
    <!-- muse read fields -->
    <rect x="520" y="336" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="520" y="336" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="620" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Muse Spark reads the card</text>
    <text x="620" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">insurer · member id · valid thru · JSON</text>

    <!-- legend strip -->
    <line x1="30" y1="440" x2="930" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="30" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="100" y="448" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="120" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">META MODEL</text>
    <rect x="260" y="448" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="280" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OUR CODE</text>
    <rect x="420" y="448" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="440" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORE</text>
    <rect x="580" y="448" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="600" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PATIENT INPUT</text>
    <line x1="740" y1="454" x2="772" y2="454" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="780" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">WRITTEN, NOT READ</text>
  </svg>